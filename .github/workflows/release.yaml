name: Release

# Builds the container image for a version tag and publishes it to ghcr.io. Nothing else
# publishes: a push to main does not run this. The tag must match the version in
# pyproject.toml and in the frontend's package.json, and the frontend must have the same tag.
#
# The registry, attestation and report-upload steps are skipped when ACT is set, so the job
# can be run on a developer machine without publishing anything.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/inkspireeditor/inkspire

jobs:
  verify:
    name: Tests and versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the frontend at the same tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InkSpireEditor/inkspire-frontend
          ref: ${{ github.ref_name }}
          path: frontend-src
          persist-credentials: false

      - name: The tag, the API and the frontend name one version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          api=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          frontend=$(python3 -c 'import json; print(json.load(open("frontend-src/package.json"))["version"])')
          echo "tag=$TAG api=$api frontend=$frontend"
          [ "$TAG" = "v$api" ] && [ "$TAG" = "v$frontend" ] || { echo "The tag and the two versions differ." >&2; exit 1; }

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the API
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install

      - name: Tests
        run: poetry run pytest

      - name: Lint and types
        run: |
          poetry run pylint --rcfile=.github/workflows/pylintrc --fail-under=9.5 inkspire_api lorebook timeline
          poetry run ty check

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Frontend checks
        working-directory: frontend-src
        run: |
          npm ci --ignore-scripts
          npm run type-check
          npx vitest run
          npm run build-only

  image:
    name: Build, check and publish the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Check out the API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the frontend at the same tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: InkSpireEditor/inkspire-frontend
          ref: ${{ github.ref_name }}
          path: frontend-src
          persist-credentials: false

      # No layer cache is read or written: nothing another workflow stored can end up in
      # the image.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag inkspire:release .

      - name: Vulnerability report
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inkspire:release
          format: sarif
          output: trivy.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload the report
        if: ${{ !env.ACT }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

      - name: Refuse a fixable critical or high vulnerability, or a secret
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inkspire:release
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Software bill of materials
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inkspire:release
          format: cyclonedx
          output: sbom.cdx.json

      - name: Log in to ghcr.io
        if: ${{ !env.ACT }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What was built, checked and scanned above is what is pushed: the same local image,
      # under its tags.
      - name: Push
        id: push
        if: ${{ !env.ACT }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          tags="$version"
          # A release candidate gets its own tag only; latest and X.Y follow a final version.
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags="$tags ${version%.*} latest"
          fi
          for tag in $tags; do
            docker tag inkspire:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the build
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the bill of materials
        if: ${{ !env.ACT }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the real minimum: composer.json says ">=8.3", but Symfony 8.1
        # requires >=8.4.1 and doctrine-bundle requires ^8.4, so the lock file
        # cannot be installed on 8.3. 8.5 is what development runs on.
        php-version: ['8.4', '8.5']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, pdo_sqlite
          coverage: none

      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The test env uses a dedicated passphrase-less keypair, so no secrets are
      # needed here. See config/packages/test/lexik_jwt_authentication.yaml.
      - name: Generate the test JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --env=test

      # No doctrine:database:create step: the SQLite driver has no
      # CREATE DATABASE, so that command exits 1. The .db file is created when
      # the migration connects to it.
      - name: Migrate the test database
        run: |
          mkdir -p var
          php bin/console doctrine:migrations:migrate --env=test -n

      # var/files_test/ is created by AuthenticatedWebTestCase::setUp().
      - name: Run the test suite
        run: php bin/phpunit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # --no-check-publish: this is an application, not a published package, so
      # composer.json intentionally has no name or description.
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Lint YAML config
        run: php bin/console lint:yaml config

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Check that the Doctrine mapping is valid
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

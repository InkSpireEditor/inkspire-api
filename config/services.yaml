# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    # Order matters: the committed default sets app.llm_providers to [], then the
    # gitignored user file (if present) overrides it. Imports are always processed
    # before this file's own parameters block, so the default cannot live here.
    - { resource: 'llm_providers_default.yaml' }
    - { resource: 'llm_providers.yaml', ignore_errors: true }

parameters:
    app.llm_temperature: 1
    app.llm_timeout: 120   # seconds; idle+total budget for a generation (raise for slow reasoning models)
    # Ollama's `think` extension: true asks a reasoning model to think, false asks
    # it not to. Left null the key is not sent at all, which is what a provider
    # that only speaks the OpenAI spec expects.
    app.llm_think: ~
    app.files_dir: 'var/files'

    # Login throttling, applied per client IP by the security firewall.
    app.rate_limiter.login_max_attempts: 5
    app.rate_limiter.login_interval: '1 minute'

    # Generation throttling, applied per authenticated user.
    app.rate_limiter.llm_limit: 20
    app.rate_limiter.llm_interval: '1 minute'

    # Auth cookie lifetimes, in seconds. app.jwt_ttl also drives
    # lexik_jwt_authentication.token_ttl so the cookie and the token expire together.
    app.jwt_ttl: 3600
    app.refresh_token_ttl: 604800

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    'App\Service\FilePathValidator':
        arguments:
            $projectRoot: '%kernel.project_dir%'
            $basePathRelative: '%app.files_dir%'

    'App\Service\FileStorageServiceInterface':
        alias: App\Service\FileStorageService

    'App\Service\LLMServiceInterface':
        alias: App\Service\LLMService

    'App\Service\LLMService':
        arguments:
            $providers: '%app.llm_providers%'
            $temperature: '%app.llm_temperature%'
            $timeout: '%app.llm_timeout%'
            $think: '%app.llm_think%'

when@test:
    parameters:
        app.files_dir: 'var/files_test'
